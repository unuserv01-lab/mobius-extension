<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MOBIUS — Side Panel</title>
    <style>
      /* v7 palette (logo DNA): dark #04000F, surfaces #17122E / #221A3E,
         gradient #1A73E8 -> #7C4DFF, glow #B388FF, text #F2EDFF, muted #B9B3D6. */
      :root { color-scheme: dark; }
      body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #04000f; color: #f2edff; }
      header { background: linear-gradient(135deg, #1a73e8, #7c4dff); color: #fff; padding: 14px 16px; display: flex; align-items: center; gap: 10px; }
      header img { width: 40px; height: 40px; border-radius: 12px; box-shadow: 0 0 12px rgba(179, 136, 255, .7); }
      header h1 { margin: 0; font-size: 18px; }
      header p { margin: 2px 0 0; font-size: 12px; opacity: .9; }
      nav { display: flex; gap: 4px; padding: 8px; background: #17122e; border-bottom: 1px solid #221a3e; position: sticky; top: 0; }
      nav button { flex: 1; border: 1px solid #3a2e6b; background: #221a3e; color: #f2edff; border-radius: 8px; padding: 8px 4px; font-size: 12px; font-weight: 600; cursor: pointer; }
      nav button.active { background: linear-gradient(135deg, #1a73e8, #7c4dff); color: #fff; border-color: transparent; }
      main { padding: 14px; }
      section h2 { font-size: 15px; margin: 4px 0 8px; color: #f2edff; }
      .card { background: #17122e; border: 1px solid #221a3e; border-radius: 10px; padding: 12px; margin-bottom: 10px; }
      .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid #221a3e; }
      .row:last-child { border-bottom: none; }
      .row small { display: block; color: #b9b3d6; font-weight: 400; margin-top: 2px; }
      .switch { width: 44px; height: 24px; appearance: none; background: #3a2e6b; border-radius: 12px; position: relative; cursor: pointer; flex-shrink: 0; }
      .switch:checked { background: #7c4dff; }
      .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: left .15s; }
      .switch:checked::after { left: 22px; }
      .badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 10px; }
      .badge.on-device { background: #1b3a24; color: #81c995; }
      .badge.cloud { background: #3a2f10; color: #fdd663; }
      .badge.local-fallback { background: #221a3e; color: #b9b3d6; }
      .badge.local-server { background: #12283a; color: #8ab4f8; }
      .badge.skill { background: #2c1a4d; color: #b388ff; }
      .mono { font-family: ui-monospace, monospace; font-size: 11px; word-break: break-word; }
      .muted { color: #b9b3d6; font-size: 12px; }
      .btn { border: 1px solid #3a2e6b; background: #221a3e; color: #f2edff; border-radius: 8px; padding: 8px 12px; font-size: 13px; cursor: pointer; }
      .btn.danger { color: #ef5350; border-color: #ef5350; }
      .btn.primary { background: linear-gradient(135deg, #1a73e8, #7c4dff); color: #fff; border-color: transparent; }
      input[type="text"], input[type="number"], select { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #3a2e6b; border-radius: 8px; font-size: 13px; background: #221a3e; color: #f2edff; }
      .log-entry { font-size: 12px; }
      .log-entry time { color: #b9b3d6; }
      .chat-msg { margin: 6px 0; font-size: 13px; line-height: 1.5; }
      .chat-msg .who { font-size: 11px; font-weight: 700; color: #b388ff; }
      .chat-msg.user .who { color: #8ab4f8; }
    </style>
    <script type="module" crossorigin src="/assets/index-CmW34SOR.js"></script>
  </head>
  <body>
    <header>
      <img id="logo" alt="MOBIUS" />
      <div>
        <h1>MOBIUS</h1>
        <p>Your Intelligence. Everywhere. Owned by You.</p>
      </div>
    </header>
    <nav id="tabs">
      <button data-tab="onboarding">Onboarding</button>
      <button data-tab="router" class="active">Router Log</button>
      <button data-tab="chat">Chat</button>
      <button data-tab="settings">Settings</button>
      <button data-tab="history">History</button>
    </nav>
    <main id="view"></main>
  </body>
</html>
